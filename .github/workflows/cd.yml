name: Agent CD

on:
  workflow_run:
    workflows: ["Agent CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type deploy to release the selected main commit"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: ECR to private EC2 Blue/Green
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       inputs.confirm == 'deploy') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       vars.CD_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      # 백엔드 CD와 다른 그룹이다. 같은 EC2를 쓰지만 슬롯·nginx 링크·flock이
      # 전부 분리돼 있어 동시에 돌아도 서로를 밀어내지 않는다.
      group: agent-production-deploy
      cancel-in-progress: false

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EC2_ENV_FILE: ${{ vars.EC2_ENV_FILE || '/home/ubuntu/bidding-agent/.env' }}
      DRAIN_SECONDS: ${{ vars.DRAIN_SECONDS || '30' }}

    steps:
      - name: Resolve deployment commit
        shell: bash
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            deploy_sha="${WORKFLOW_RUN_SHA}"
          else
            deploy_sha="${GITHUB_SHA}"
          fi

          if [[ ! "${deploy_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid deployment SHA: ${deploy_sha}"
            exit 1
          fi

          echo "DEPLOY_SHA=${deploy_sha}" >> "${GITHUB_ENV}"

      - name: Check deployment configuration
        shell: bash
        run: |
          for variable_name in \
            AWS_REGION ECR_REPOSITORY EC2_INSTANCE_ID AWS_ROLE_ARN EC2_ENV_FILE; do
            if [[ -z "${!variable_name}" ]]; then
              echo "::error::Repository variable ${variable_name} is required."
              exit 1
            fi
          done

          if [[ ! "${DRAIN_SECONDS}" =~ ^[0-9]+$ ]]; then
            echo "::error::DRAIN_SECONDS must be an integer."
            exit 1
          fi

      - name: Checkout deployment commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: bidmate-agent-blue-green

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check immutable image
        id: image
        shell: bash
        run: |
          if aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids "imageTag=${DEPLOY_SHA}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "Reusing immutable image ${DEPLOY_SHA}."
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up QEMU
        if: steps.image.outputs.exists != 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable ARM64 image
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.DEPLOY_SHA }}
          build-args: |
            APP_VERSION=${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=agent-arm64
          cache-to: type=gha,mode=max,scope=agent-arm64
          provenance: mode=max
          sbom: true

      - name: Deploy through SSM Run Command
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          image_uri="${ECR_REGISTRY}/${ECR_REPOSITORY}:${DEPLOY_SHA}"
          script_base64="$(base64 -w 0 deploy/deploy-blue-green.sh)"
          blue_base64="$(base64 -w 0 deploy/nginx/blue.conf)"
          green_base64="$(base64 -w 0 deploy/nginx/green.conf)"

          parameters="$(
            jq -cn \
              --arg script "${script_base64}" \
              --arg blue "${blue_base64}" \
              --arg green "${green_base64}" \
              --arg image "${image_uri}" \
              --arg region "${AWS_REGION}" \
              --arg env_file "${EC2_ENV_FILE}" \
              --arg drain "${DRAIN_SECONDS}" \
              '{
                commands: [
                  "set -eu",
                  ("printf %s " + $script + " | base64 --decode > /tmp/bidmate-agent-deploy.sh"),
                  ("printf %s " + $blue + " | base64 --decode > /tmp/bidmate-agent-blue.conf"),
                  ("printf %s " + $green + " | base64 --decode > /tmp/bidmate-agent-green.conf"),
                  "chmod 700 /tmp/bidmate-agent-deploy.sh",
                  ("/tmp/bidmate-agent-deploy.sh " + $image + " " + $region + " " + $env_file + " /tmp/bidmate-agent-blue.conf /tmp/bidmate-agent-green.conf " + $drain),
                  "rm -f /tmp/bidmate-agent-deploy.sh /tmp/bidmate-agent-blue.conf /tmp/bidmate-agent-green.conf"
                ]
              }'
          )"

          command_id="$(
            aws ssm send-command \
              --instance-ids "${EC2_INSTANCE_ID}" \
              --document-name "AWS-RunShellScript" \
              --comment "BidMate Agent Blue/Green ${DEPLOY_SHA}" \
              --parameters "${parameters}" \
              --query "Command.CommandId" \
              --output text
          )"

          echo "SSM command: ${command_id}"

          status="Pending"
          for _ in $(seq 1 72); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "${command_id}" \
                --instance-id "${EC2_INSTANCE_ID}" \
                --query "Status" \
                --output text 2>/dev/null \
                || true
            )"

            case "${status}" in
              Success | Cancelled | TimedOut | Failed)
                break
                ;;
            esac
            sleep 5
          done

          invocation="$(
            aws ssm get-command-invocation \
              --command-id "${command_id}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --output json
          )"

          echo "${invocation}" | jq -r '"Status: " + .Status'
          echo "${invocation}" | jq -r '.StandardOutputContent'
          echo "${invocation}" | jq -r '.StandardErrorContent' >&2

          if [[ "${status}" != "Success" ]]; then
            echo "::error::Deployment failed with SSM status ${status}."
            exit 1
          fi
