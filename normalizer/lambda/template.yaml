AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  BidMate 공고 자격요건 정규화 배치.
  normalize_output_adapter.run()을 EventBridge 정기 스케줄로 실행(증분).

Parameters:
  DbSecretArn:
    Type: String
    Description: RDS DSN이 담긴 Secrets Manager 시크릿 ARN
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: RDS(bidmate)에 접근 가능한 프라이빗 서브넷 (보통 RDS와 동일 VPC)
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: RDS 5432 인바운드가 허용된 보안그룹
  Schedule:
    Type: String
    Default: "rate(1 hour)"
    Description: >
      EventBridge 스케줄. 예) rate(1 hour), rate(30 minutes),
      cron(0 */2 * * ? *)=2시간마다. 신규 공고 유입 빈도에 맞춰 조정.
  DryRun:
    Type: String
    Default: "0"
    AllowedValues: ["0", "1"]
    Description: "1이면 미기록(계획만). 최초 배포 후 점검 시 1로 한 번 돌려볼 것."

Resources:
  NormalizeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bidmate-normalize
      CodeUri: src/
      Handler: lambda_function.handler
      Runtime: python3.12
      Timeout: 900            # 15분(최대). 증분은 훨씬 짧지만 백로그 대비 여유.
      MemorySize: 512
      Architectures: [x86_64]
      Environment:
        Variables:
          DB_SECRET_ARN: !Ref DbSecretArn
          DRY_RUN: !Ref DryRun
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds: !Ref SecurityGroupIds
      Policies:
        - AWSLambdaVPCAccessExecutionRole      # VPC ENI 생성 권한
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
      Events:
        ScheduledRun:
          Type: Schedule
          Properties:
            Schedule: !Ref Schedule
            Enabled: true
            Description: BidMate 정규화 정기 실행

Outputs:
  FunctionName:
    Value: !Ref NormalizeFunction
  FunctionArn:
    Value: !GetAtt NormalizeFunction.Arn
